server:
  port: 8082
spring:
  application:
    name: fees-collection-service

  datasource:
    url: jdbc:h2:mem:feesdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  resilience4j:
    circuitbreaker:
      instances:
        studentService:
          registerHealthIndicator: true
          slidingWindowSize: 10
          failureRateThreshold: 50
          waitDurationInOpenState: 10s
          permittedNumberOfCallsInHalfOpenState: 3

logging:
  pattern:
    level: "%5p [${spring.application.name},correlationId=%X{correlationId:-}]"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: fees-collection-service
    instance-id: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true


info:
  app:
    name: "Fees Collection Service"
    description: "Fees Collection Service"
    version: "1.0.0"